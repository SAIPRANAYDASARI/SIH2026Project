# Production reverse proxy: serves the built frontend, proxies /api to the
# backend, and — this is the part that actually matters for this app —
# disables proxy buffering on the SSE chat endpoint. Nginx buffers
# upstream responses by default; for a Server-Sent Events stream
# (`app/api/v1/chat.py`'s `POST /api/v1/chat`) that means tokens sit in a
# buffer until it fills or the response ends, defeating the entire point of
# streaming. `X-Accel-Buffering: no` is also set by the backend itself
# (see chat.py) as a second layer, but that header alone does nothing
# unless `proxy_buffering off` (or `gzip off`) is also configured on the
# proxy — Nginx's *own* buffering is what has to be turned off here.

user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # gzip is fine for the built JS/CSS bundle; must stay off (or be
    # excluded) for the SSE location below — gzip buffers full responses
    # before compressing, same problem as proxy buffering.
    gzip on;
    gzip_types text/css application/javascript application/json;

    upstream backend_upstream {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # SSE chat endpoint — buffering off, generous timeouts (a long
        # LLM generation must not be killed mid-stream), HTTP/1.1 required
        # for chunked/streamed responses.
        location = /api/v1/chat {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            chunked_transfer_encoding on;
        }

        # Every other /api/v1/* route: normal buffered proxying is fine —
        # they return one JSON body, not a stream.
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # The built React SPA. `try_files ... /index.html` so client-side
        # routing (react-router-dom's /dashboard route, Step 11) works on a
        # hard refresh instead of 404ing at Nginx.
        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }
    }
}
