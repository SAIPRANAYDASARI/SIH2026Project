code: ISI_SCHEME_I
name: "ISI Mark — Scheme I (Standard Mark of Conformity)"
description: >
  The general BIS product certification scheme under which a manufacturer
  is licensed to apply the ISI mark to a product after a factory audit and
  successful testing against the relevant Indian Standard, followed by
  ongoing surveillance.
product_keywords:
  - electrical appliance
  - switch
  - cable
  - cement
  - steel
  - lpg cylinder
  - helmet
  - toy
  - pressure cooker
  - battery
mandatory: false
fees:
  - category: "Application fee"
    fee_inr: 1000
    unit: "one-time"
  - category: "Licence fee"
    fee_inr: 1000
    unit: "per annum"
  - category: "Marking fee"
    fee_inr: 5000
    unit: "per annum (minimum, varies by production)"
timeline_days: 90
validity_years: 2
required_documents:
  - name: "Factory layout and manufacturing process flow chart"
    required: true
  - name: "In-house test lab equipment list"
    required: true
  - name: "Test reports from a BIS-recognised lab (if in-house testing is insufficient)"
    required: false
  - name: "Proof of manufacturing premises ownership/lease"
    required: true
source_note: >
  Illustrative placeholder values pending verified BIS circulars — confirm
  fees, timelines and document requirements directly with BIS before acting
  on them. Actual fees vary by unit classification (micro/small/medium/large)
  under the BIS (Conformity Assessment) Regulations.
