name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest --cov=app --cov-report=term-missing

  ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      # Reuses the backend's dev deps (it already needs beautifulsoup4/lxml
      # for local `python -m ingestion.cli` runs) since ingestion imports
      # app.core/app.db/app.models directly rather than duplicating them.
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check ingestion
      - run: ruff format --check ingestion
      - run: pytest ingestion/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run test -- --run

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (production target)
        run: docker build --target production -t manak-sahayak-backend:ci ./backend
      - name: Build frontend image (production target)
        run: docker build --target production -t manak-sahayak-frontend:ci ./frontend
      - name: Build worker image
        run: docker build -f worker/Dockerfile -t manak-sahayak-worker:ci .
